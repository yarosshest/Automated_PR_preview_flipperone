name: Docs Preview

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed

concurrency:
  group: .my.docs-preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  CF_PAGES_PROJECT_NAME: ${{ vars.CF_PAGES_PROJECT_NAME }}
  CF_PAGES_PREVIEW_BRANCH: pr-${{ github.event.pull_request.number }}
  CF_PAGES_PREVIEW_URL: https://pr-${{ github.event.pull_request.number }}.${{ vars.CF_PAGES_PROJECT_NAME }}.pages.dev
  ARCHBEE_PREVIEW_PORT: 3000

jobs:
  deploy-preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install CLI dependencies
        run: npm install --global @archbee/cli wrangler

      - name: Verify workflow configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CF_PAGES_PROJECT_NAME}"
          test -n "${CLOUDFLARE_API_TOKEN}"
          test -n "${CLOUDFLARE_ACCOUNT_ID}"

      - name: Export Archbee preview to static files
        run: bash scripts/export_archbee_preview.sh .cf-pages-output

      - name: Deploy preview to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -euo pipefail
          wrangler pages deploy .cf-pages-output \
            --project-name "${CF_PAGES_PROJECT_NAME}" \
            --branch "${CF_PAGES_PREVIEW_BRANCH}"

      - name: Create or update PR comment
        uses: actions/github-script@v8
        env:
          PREVIEW_URL: ${{ env.CF_PAGES_PREVIEW_URL }}
          PREVIEW_BRANCH: ${{ env.CF_PAGES_PREVIEW_BRANCH }}
        with:
          script: |
            const marker = '<!-- flipperone-docs-preview -->';
            const body = `${marker}
            Docs preview is ready.

            - Preview: ${process.env.PREVIEW_URL}
            - Branch alias: \`${process.env.PREVIEW_BRANCH}\`
            - Commit: \`${context.payload.pull_request.head.sha.slice(0, 7)}\`

            This comment is updated automatically on every push.`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find((comment) =>
              comment.user?.login === 'github-actions[bot]' &&
              comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  cleanup-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install --global wrangler

      - name: Delete preview deployments for PR branch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: node scripts/cloudflare_pages_cleanup.mjs

      - name: Update PR comment after cleanup
        uses: actions/github-script@v8
        env:
          PREVIEW_BRANCH: ${{ env.CF_PAGES_PREVIEW_BRANCH }}
        with:
          script: |
            const marker = '<!-- flipperone-docs-preview -->';
            const body = `${marker}
            Docs preview has been closed.

            - Branch alias: \`${process.env.PREVIEW_BRANCH}\`
            - State: PR closed

            Cleanup was requested for the preview deployment.`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find((comment) =>
              comment.user?.login === 'github-actions[bot]' &&
              comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
